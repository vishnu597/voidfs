[package]
name = "voidfs-sdk"
description = "The voidfs SDK for Rust: the AWS SDK for S3, plus typed calls for the x-voidfs-* extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aws-credential-types = "1.2.11"
aws-sdk-s3 = "1.148.0"
aws-sigv4 = { version = "1.3.8", features = ["sign-http", "http1"] }
base64 = "0.23.1"
bytes = "1.12.1"
http = "1.5.0"
percent-encoding = "2.3.2"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["time"] }
voidfs-core = { version = "0.0.0", path = "../voidfs-core" }

[dev-dependencies]
axum = "0.8.9"
futures = "0.3.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util"] }
voidfs-server = { version = "0.0.0", path = "../voidfs-server" }

[lints]
workspace = true
