[package]
name = "voidfs-daemon"
description = "The voidfs per-user agent that `void daemon run` runs: the client core behind a Unix socket, with HTTP and JSON over it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "net", "sync", "time", "fs", "macros", "signal"] }
voidfs-client = { version = "0.0.0", path = "../voidfs-client" }
voidfs-sdk = { version = "0.0.0", path = "../voidfs-sdk" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
voidfs-server = { version = "0.0.0", path = "../voidfs-server" }

[lints]
workspace = true
