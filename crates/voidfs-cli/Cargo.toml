[package]
name = "voidfs-cli"
description = "void, the voidfs command line: drives, forks, history, show, restore and upload, and the per-user daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "void"
path = "src/main.rs"

[dependencies]
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
voidfs-client = { version = "0.0.0", path = "../voidfs-client" }
voidfs-daemon = { version = "0.0.0", path = "../voidfs-daemon" }
voidfs-sdk = { version = "0.0.0", path = "../voidfs-sdk" }

[dev-dependencies]
voidfs-server = { version = "0.0.0", path = "../voidfs-server" }

[lints]
workspace = true
