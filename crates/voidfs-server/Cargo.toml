[package]
name = "voidfs-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
crc = "3.4.0"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
http-body-util = "0.1.5"
moka = { version = "0.12.16", features = ["sync"] }
opendal = { version = "0.57.0", features = ["services-fs", "services-s3"] }
percent-encoding = "2.3.2"
rand = "0.10.3"
reqsign-aws-v4 = { version = "3.3.1", default-features = false }
reqsign-core = { version = "3.3.2", default-features = false }
reqsign-file-read-tokio = { version = "3.0.7", default-features = false }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
voidfs-core = { version = "0.0.0", path = "../voidfs-core" }

[lints]
workspace = true

[dev-dependencies]
aws-credential-types = "1.2.11"
aws-sigv4 = "1.3.8"
