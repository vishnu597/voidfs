[package]
name = "voidfs-client"
description = "The voidfs client core: the disk cache and fetcher, the write journal and upload queue, and the change-feed client that the daemon and the mount run"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crc32c = "0.6.8"
fs4 = "1.1.0"
futures = "0.3.34"
hex = "0.4.3"
libc = "0.2.189"
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "fs", "macros"] }
unicode-normalization = "0.1.25"
voidfs-core = { version = "0.0.0", path = "../voidfs-core" }
voidfs-format = { version = "0.0.0", path = "../voidfs-format" }
voidfs-sdk = { version = "0.0.0", path = "../voidfs-sdk" }
xattr = "1.6.1"

[dev-dependencies]
axum = "0.8.9"
bytes = "1.12.1"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
voidfs-server = { version = "0.0.0", path = "../voidfs-server" }

[lints]
workspace = true
