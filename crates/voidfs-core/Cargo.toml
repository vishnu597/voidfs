[package]
name = "voidfs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
fastcdc = "5.0.0"
hex = "0.4.3"
imbl = "7.0.2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
ulid = "3.0.0"
uuid = { version = "1.26.1", features = ["v4", "v7"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
