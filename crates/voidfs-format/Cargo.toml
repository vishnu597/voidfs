[package]
name = "voidfs-format"
description = "A reader of the voidfs on-bucket format: a pool's drives, their checkpoints and logs, and manifest trees, from nothing but read access to the bucket"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
voidfs-core = { version = "0.0.0", path = "../voidfs-core" }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
voidfs-sdk = { version = "0.0.0", path = "../voidfs-sdk" }
voidfs-server = { version = "0.0.0", path = "../voidfs-server" }

[lints]
workspace = true
