[package]
name = "voidfs-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
# Pinned to the version SpaceFS's published run used (docs.spacefs.com/benchmarks/methodology/).
aws-sdk-s3 = "=1.148.0"
aws-credential-types = "1.2.11"
aws-sigv4 = { version = "1.3.8", features = ["sign-http", "http1"] }
aws-smithy-runtime-api = "1.18.0"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
http = "1.5.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
voidfs-core = { version = "0.0.0", path = "../voidfs-core" }

[lints]
workspace = true
