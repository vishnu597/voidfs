#
# voidfs-server with Compose. From this directory:
#
#   cp example.env .env        # then set the keys in .env
#   docker compose up -d --build
#
# The pool lives in the voidfs-data volume unless .env points VOIDFS_STORE at a bucket. To run
# MinIO beside it as the bucket, add compose.minio.yaml (see README.md).

name: voidfs

services:
  voidfs:
    build:
      context: ../..
    image: voidfs-server:local
    env_file:
      - path: .env
        required: false
    environment:
      VOIDFS_ACCESS_KEY_ID: ${VOIDFS_ACCESS_KEY_ID:?set VOIDFS_ACCESS_KEY_ID in .env}
      VOIDFS_SECRET_ACCESS_KEY: ${VOIDFS_SECRET_ACCESS_KEY:?set VOIDFS_SECRET_ACCESS_KEY in .env}
    ports:
      - "${VOIDFS_PORT:-127.0.0.1:9000}:9000"
    volumes:
      - voidfs-data:/data
    # Any HTTP answer means the server is up; an unsigned request gets 403.
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:9000/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  voidfs-data:
